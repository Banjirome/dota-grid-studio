name: Manual Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to generate one)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Run tests
        run: go test ./...

      - name: Build Windows executable
        run: wails build -platform windows/amd64 -clean

      - name: Prepare release files and notes
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          [string]$requestedTag = $env:REQUESTED_TAG
          $requestedTag = $requestedTag.Trim()
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $requestedTag = "build-$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_RUN_ATTEMPT)-$shortSha"
          }
          if ($requestedTag -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "Invalid release tag: $requestedTag"
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build/bin/dota-grid-maker.exe release/dota-grid-maker-windows-amd64.exe

          $hash = (Get-FileHash release/dota-grid-maker-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *dota-grid-maker-windows-amd64.exe" | Set-Content release/SHA256SUMS.txt -Encoding utf8

          $message = (git log -1 --pretty=format:%B).Trim()
          $notes = @(
            $message
            ""
            "---"
            ""
            "**Commit:** ``$($env:GITHUB_SHA)``"
            ""
            "Built automatically by the manual release workflow."
          ) -join "`n"
          $notes | Set-Content release-notes.md -Encoding utf8

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$requestedTag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "title=Dota Grid Studio $requestedTag"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            'release/dota-grid-maker-windows-amd64.exe',
            'release/SHA256SUMS.txt',
            '--target', $env:GITHUB_SHA,
            '--title', $env:RELEASE_TITLE,
            '--notes-file', 'release-notes.md'
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
